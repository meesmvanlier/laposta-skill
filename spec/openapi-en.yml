    post:
      operationId: campagneContentVullen
      tags:
      - Campaigns
      summary: Filling campaign content
      description: 'Filling in the content of a campaign The campaign can either be filled directly with html, or through a URL, in which case Laposta imports the html found at the specified URL. One of the two must be chosen. If both parameters are given the html is taken. If the import fails, a 400 error message from the API will occur. If it does succeed in importing the html, but problems were found during the import, they are shown in the variable report in the response. These may include: Solving these problems is not necessary in order to properly send the newsletter, but it is highly recommended. In the case of a free account, our advertising is added to the bottom of the newsletter. If the offered html does not contain an unsubscribe link, it will simply be added by our program.'
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - njhgaf61ye
        description: The id of the campaign. You find it in the response of [Get all campaigns](/campagnes/alle-campagnes-opvragen).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                html:
                  type: string
                  examples:
                  - <html><body><p>Hallo {{voornaam}}</p></body></html>
                  description: The html for the campaign
                import_url:
                  type: string
                  examples:
                  - https://example.net/nieuwsbrief.html
                  description: The URL from which the html must be imported
                inline_css:
                  type: boolean
                  examples:
                  - 'true'
                  description: Potential inlining of css (true or false)
                javascript:
                  type: string
                  examples:
                  - string
                  description: JavaScript was encountered
                flash:
                  type: string
                  examples:
                  - string
                  description: Flash was encountered
                no_unsubscribe:
                  type: string
                  examples:
                  - string
                  description: No unsubscribe could be located
                empty_unsubscribe:
                  type: string
                  examples:
                  - string
                  description: Empty unsubscribe encountered
                css:
                  type: string
                  examples:
                  - string
                  description: Missing external css files (listed)
                images:
                  type: string
                  examples:
                  - string
                  description: Missing external images (listed)
      responses:
