components:
  securitySchemes:
    apiKey:
      type: http
      scheme: basic
      x-fern-basic:
        username:
          name: api_key
        password:
          name: leave_empty
          omit: true
      description: Enter your API key at `api_key` and leave `leave_empty` empty. The API uses basic auth, with your key in place of the username. In curl that reads `-u YOUR_KEY:`, with a colon and nothing after it.
  schemas:
    List:
      type: object
      description: The list object
      properties:
        list_id:
          type: string
          description: ID of the list in question
          examples:
          - BaImMu3JZA
        timezone:
          type: string
          description: The account timezone used for datetime fields
          examples:
          - Europe/Amsterdam
        created:
          type: string
          description: Date and time of creation
        created_iso:
          type:
          - string
          - 'null'
          description: Date and time of creation in ISO format
        modified:
          type:
          - string
          - 'null'
          description: Date and time of last modification made
        modified_iso:
          type:
          - string
          - 'null'
          description: Date and time of last modification in ISO format
        state:
          type: string
          description: 'Status of the list: active or deleted'
          enum: *id003
        name:
          type: string
          description: Name given to the list in question
          examples:
          - Nieuwsbrief
        locked:
          type: boolean
          description: If a list is locked, it cannot be changed by a user of the application. (true or false)
        remarks:
          type: string
          description: Potential remarks
        subscribe_notification_email:
          type: string
          description: Email address to which a notification will be sent upon a subscription
        unsubscribe_notification_email:
          type: string
          description: Email address to which a notification will be sent upon the cancelling of a subscription
        members:
          type: object
          description: Information in regards to the number of active, unsubscribed and cleaned (deleted) members
        account_id:
          type: string
          description: The id of the account this list belongs to.
          examples:
          - wFiUS4HL4e
    ListEnvelope:
      type: object
      properties:
        list:
          $ref: '#/components/schemas/List'
    ListList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ListEnvelope'
    Field:
      type: object
      description: The field object
      properties:
        field_id:
          type: string
          description: The ID of the field in question
          examples:
          - Z87ysHha9A
        list_id:
          type: string
          description: The ID of the list to which the field belongs
          examples:
          - BaImMu3JZA
        timezone:
          type: string
          description: The account timezone used for datetime fields
          examples:
          - Europe/Amsterdam
        created:
          type: string
          description: Date and time of creation
        created_iso:
          type:
          - string
          - 'null'
          description: Date and time of creation in ISO format
        modified:
          type:
          - string
          - 'null'
          description: Always null. Field modification times are not stored and this field is kept for backwards compatibility.
        state:
          type: string
          description: 'The status of the field in question: either active or deleted'
          enum: *id003
        name:
          type: string
          description: Name of the field (for displaying purposes)
          examples:
          - Nieuwsbrief
        tag:
          type: string
          description: The subscriber variable for usage in campaigns (not modifyable)
        custom_name:
          type: string
          description: Name of the field (for use in member API calls)
        defaultvalue:
          type: string
          description: The default value (will be used in the absence of this field)
        datatype:
          type: string
          description: The data type of the field in question (text, numeric, date, select_single, select_multiple or labels). The labels type belongs to the Labels field, which comes into being by itself as soon as your list has at least one label; you do not create that field yourself.
          enum:
          - text
          - numeric
          - date
          - select_single
          - select_multiple
          - labels
        datatype_display:
          type: string
          description: 'Only applicable for select_single: the desired display (select, radio)'
          enum: *id002
        options:
          type: array
          items:
            type: string
          description: An array of the available options (for select_single, select_multiple or labels). For a labels field, these are the labels of this list.
        options_full:
          type: array
          items:
            type: string
          description: An array of the available options, including IDs (for select_single, select_multiple or labels).
        required:
          type: boolean
          description: Is this a mandatory field? (true or false)
        in_form:
          type: boolean
          description: Does this field occur in the subscription form? (true or false)
        in_list:
          type: boolean
          description: Does this field occur while browsing the list? (true or false)
        autocomplete:
          type: string
          description: The value for the html autocomplete attribute (string)
        pos:
          type: string
          description: The position of this field in the list, as a string containing a number.
        is_email:
          type: boolean
          description: Whether this is the email field of the list.
    FieldEnvelope:
      type: object
      properties:
        field:
          $ref: '#/components/schemas/Field'
    FieldList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FieldEnvelope'
    Segment:
      type: object
      description: The segment object
      properties:
        segment_id:
          type: string
          description: The ID of this segment
          examples:
          - pDrp5KOD0z
        list_id:
          type: string
          description: The ID of the list to which the segment belongs
          examples:
          - BaImMu3JZA
        timezone:
          type: string
          description: The account timezone used for datetime fields
          examples:
          - Europe/Amsterdam
        name:
          type: string
          description: The name of the segment
          examples:
          - Nieuwsbrief
        definition:
          type: string
          description: The definition of the segment (string in JSON format)
        created:
          type: string
          description: Time of creation
        created_iso:
          type:
          - string
          - 'null'
          description: Time of creation in ISO format
        modified:
          type:
          - string
          - 'null'
          description: Time of last modification
        modified_iso:
          type:
          - string
          - 'null'
          description: Time of last modification in ISO format
        state:
          type: string
          description: 'The state of this segment: active or deleted.'
          enum: *id003
    SegmentEnvelope:
      type: object
      properties:
        segment:
          $ref: '#/components/schemas/Segment'
    SegmentList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SegmentEnvelope'
    Member:
      type: object
      description: The member object
      properties:
        member_id:
          type: string
          description: The ID of this member object
          examples:
          - ZKfjhLJHfl
        list_id:
          type: string
          description: The ID of the related list
          examples:
          - BaImMu3JZA
        email:
          type: string
          description: The email address
          examples:
          - relatie@example.net
        state:
          type: string
          description: 'The current status of this subscriber: active, unsubscribed, unconfirmed or cleaned'
          enum: *id003
        timezone:
          type: string
          description: The account timezone used for datetime fields
          examples:
          - Europe/Amsterdam
        signup_date:
          type: string
          description: Date and time of subscription
        signup_date_iso:
          type:
          - string
          - 'null'
          description: Date and time of subscription in ISO format
        modified:
          type:
          - string
          - 'null'
          description: Date and time of last modification made
        modified_iso:
          type:
          - string
          - 'null'
          description: Date and time of last modification in ISO format
        confirm_date:
          type:
          - string
          - 'null'
          description: Date and time of confirmation
        confirm_date_iso:
          type:
          - string
          - 'null'
          description: Date and time of confirmation in ISO format
        ip:
          type: string
          description: IP from which the subscriber is registered
        source_url:
          type: string
          description: URL from which the subscriber is registered
        custom_fields:
          type: object
          description: An array with the value of all additional fields of the corresponding list. If there are fields where several options can be selected, these options are listed in an array. If the list has labels, `labels` is included as well, with the labels of that subscriber as an array.
    MemberEnvelope:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/Member'
    MemberList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MemberEnvelope'
    Webhook:
      type: object
      description: The webhook object
      properties:
        webhook_id:
          type: string
          description: The ID of this webhook
          examples:
          - k5RaJhbnLa
        list_id:
          type: string
          description: The ID of the list to which the field belongs
          examples:
          - BaImMu3JZA
        timezone:
          type: string
          description: The account timezone used for datetime fields
          examples:
          - Europe/Amsterdam
        created:
          type: string
          description: Date and time of creation
        created_iso:
          type:
          - string
          - 'null'
          description: Date and time of creation in ISO format
        modified:
          type:
          - string
          - 'null'
          description: Date and time of last modification made
        modified_iso:
          type:
          - string
          - 'null'
          description: Date and time of last modification in ISO format
        state:
          type: string
          description: 'The status of this webhook: active or deleted'
          enum: *id003
        event:
          type: string
          description: When will the webhook be requested? (subscribed, modified or deactivated)
          enum: *id004
        url:
          type: string
          description: The URL to be accessed
        blocked:
          type: boolean
          description: Is the accessing of the webhook (temporarily) blocked? (true or false)
        secret:
          type: string
          description: The webhook's signing secret, used to verify that incoming requests are from Laposta (see 'Webhook security' above)
    WebhookEnvelope:
      type: object
      properties:
        webhook:
          $ref: '#/components/schemas/Webhook'
    WebhookList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEnvelope'
    Campaign:
      type: object
      description: The campaign object
      properties:
        account_id:
          type: string
          description: The ID of this account
          examples:
          - wFiUS4HL4e
        campaign_id:
          type: string
          description: The ID of this campaign
          examples:
          - njhgaf61ye
        timezone:
          type: string
          description: The account timezone used for datetime fields
          examples:
          - Europe/Amsterdam
        created:
          type: string
          description: Date and time of creation
        created_iso:
          type:
          - string
          - 'null'
          description: Date and time of creation in ISO format
        modified:
          type:
          - string
          - 'null'
          description: Date and time of last modification made
        modified_iso:
          type:
          - string
          - 'null'
          description: Date and time of last modification in ISO format
        type:
          type: string
          description: 'The type of campaign (currently only possible: regular)'
        delivery_requested:
          type:
          - string
          - 'null'
          description: When to send
        delivery_requested_iso:
          type:
          - string
          - 'null'
          description: When to send in ISO format
        delivery_started:
          type:
          - string
          - 'null'
          description: Start of last transmission
        delivery_started_iso:
          type:
          - string
          - 'null'
          description: Start of last transmission in ISO format
        delivery_ended:
          type:
          - string
          - 'null'
          description: End of last transmission
        delivery_ended_iso:
          type:
          - string
          - 'null'
          description: End of last transmission in ISO format
        name:
          type: string
          description: Internal name of campaign
          examples:
          - Nieuwsbrief
        subject:
          type: string
          description: Subject line
        from:
          type: object
          description: Sender (name en email address)
        reply_to:
          type: string
          description: Email address for receiving replies
        list_ids:
          type: object
          description: Linked lists and segments
        stats:
          type: object
          description: Linked web statistics
        web:
          type: string
          description: URL to web version
        screenshot:
          type: object
          description: Screenshots of campaign
        previewtext:
          type: string
          description: The preheader shown after the subject line in the inbox.
    CampaignEnvelope:
      type: object
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
    CampaignList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CampaignEnvelope'
    Report:
      type: object
      description: The report object
      properties:
        account_id:
          type: string
          description: The ID of this account
          examples:
          - wFiUS4HL4e
        campaign_id:
          type: string
          description: The ID of the campaign
          examples:
          - njhgaf61ye
        sent:
          type: integer
          description: The number of emails sent
        accepted:
          type: integer
          description: The number of emails accepted by the recipient mail servers
        cleaned:
          type: integer
          description: The number of deleted subscribers
        complained:
          type: integer
          description: The number of spam complaints (by clicking on the spam button in the email program)
        hardbounced:
          type: integer
          description: The number of hard-bounces
        unsubscribed:
          type: integer
          description: The number of unsubscriptions
        opened_unique:
          type: integer
          description: The number of subscribers who have opened the email once or more
        clicked_unique:
          type: integer
          description: The number of subscribers who have clicked on the email once or more
        webversion_unique:
          type: integer
          description: The number of subscribers who have requested the web version
        accepted_ratio:
          type: number
          description: The ratio of accepted emails to the number of sent emails
        opened_ratio:
          type: number
          description: The ratio of emails opened once or more to the number of accepted emails
        clicked_ratio:
          type: number
          description: The ratio of emails that have been clicked once or more to the number of accepted emails
        from_automation:
          type: boolean
          description: Whether this delivery came from an automation.
    ReportEnvelope:
      type: object
      properties:
        report:
          $ref: '#/components/schemas/Report'
    ReportList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportEnvelope'
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              enum:
              - invalid_request
              - invalid_input
              - internal
            message:
              type: string
              examples:
              - Unknown list
            code:
              type: integer
              examples:
              - 203
            parameter:
              type: string
              examples:
              - list_id
          required:
          - type
          - message
      description: Every error has the same shape.
    History:
      type: object
      properties:
        pagination:
          type: object
          properties:
            limit:
              type: integer
              examples:
              - 100
            has_more:
              type: boolean
            next_cursor:
              type:
              - string
              - 'null'
        order:
          type: object
          properties:
            order_by:
              type: string
              examples:
              - event_date
            order:
              type: string
              enum:
              - desc
              - asc
        filters:
          type: object
          properties:
            timezone:
              type: string
              examples:
              - Europe/Amsterdam
            campaign_id:
              type:
              - string
              - 'null'
            event_date_from:
              type:
              - string
              - 'null'
            event_date_from_iso:
              type:
              - string
              - 'null'
            event_date_to:
              type:
              - string
              - 'null'
            event_date_to_iso:
              type:
              - string
              - 'null'
        data:
          type: array
          items:
            type: object
            properties:
              event:
                type: object
                properties:
                  type:
                    type: string
                    examples:
                    - unsubscribed
                  timezone:
                    type: string
                  event_date:
                    type: string
                    examples:
                    - '2026-05-18 14:30:00'
                  event_date_iso:
                    type: string
                    examples:
                    - '2026-05-18T14:30:00+02:00'
                  campaign:
                    type:
                    - object
                    - 'null'
                  details:
                    type: object
      description: A page of events, together with the pagination, sorting and filters that were applied.
    SyncResult:
      type: object
      properties:
        report:
          type: object
          properties:
            added:
              type: integer
            edited:
              type: integer
            skipped:
              type: integer
            errors:
              type: integer
        added:
          type: array
          items:
            type: object
        edited:
          type: array
          items:
            type: object
        skipped:
          type: array
          items:
            type: object
        errors:
          type: array
          items:
            type: object
      description: The result of a synchronisation, split into added, edited, skipped and failed.
    CampaignContent:
      type: object
      properties:
        campaign:
          type: object
          properties:
            account_id:
              type: string
            campaign_id:
              type: string
            html:
              type: string
            plaintext:
              type: string
            report:
              type: object
              description: Alleen bij het vullen van content, en alleen als er iets op te merken viel.
              properties:
                javascript:
                  type: boolean
                flash:
                  type: boolean
                no_unsubscribe:
                  type: boolean
                empty_unsubscribe:
                  type: boolean
                css:
                  type: array
                  items:
                    type: string
                images:
                  type: array
                  items:
                    type: string
      description: The content of a campaign in html and in plain text.
