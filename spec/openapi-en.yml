# Gegenereerd door scripts/bouw-api-spec.py. Wijzig api-bron/, niet dit bestand.
openapi: 3.1.0
info:
  title: Laposta API
  version: '2'
  description: 'The Laposta API follows REST. All responses, including errors, are JSON. Authenticate with basic auth: your API key is the username and the password stays empty.'
servers:
- url: https://api.laposta.nl/v2
security:
- apiKey: []
tags:
- name: Lists
  description: A list holds the subscribers you send newsletters to. Use these endpoints to create lists, retrieve them and empty them.
- name: Fields
  description: Fields define which data you store per subscriber. Every list has an email field, plus the fields you add yourself.
- name: Segments
  description: A segment is a selection within a list, stored as a definition of blocks and rules.
- name: Subscribers
  description: 'Subscribers are the people in a list. This is the most used part of the API: adding, updating, unsubscribing and reading history.'
- name: Webhooks
  description: A webhook lets Laposta notify your own system as soon as something changes in a list.
- name: Campaigns
  description: 'Campaigns are the newsletters themselves: create, fill with html, test, schedule and send.'
- name: Results
  description: 'The results of a sent campaign: how many arrived, were opened and were clicked.'
paths:
  /list:
    post:
      operationId: lijstToevoegen
      tags:
      - Lists
      summary: Adding a list
      description: If there is something wrong with the parameters provided, a code is displayed with an error message. You may use these in combination with the variable 'parameter' to display a message to the user. See above under 'Error messages' what the codes stand for.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  examples:
                  - Nieuwsbrief
                  description: Name given to the list in question
                locked:
                  type: boolean
                  examples:
                  - 'false'
                  description: If a list is locked, it cannot be changed by a user of the application. (true or false)
                remarks:
                  type: string
                  examples:
                  - Aangemaakt vanuit onze webshop.
                  description: Potential remarks
                subscribe_notification_email:
                  type: string
                  examples:
                  - aanmeldingen@example.net
                  description: Email address to which a notification will be sent upon a subscription
                unsubscribe_notification_email:
                  type: string
                  examples:
                  - afmeldingen@example.net
                  description: Email address to which a notification will be sent upon the cancelling of a subscription
              required:
              - name
      responses:
        '201':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: alleLijstenOpvragen
      tags:
      - Lists
      summary: Requesting all lists
      description: All lists in an array of list objects. The list objects have been ordered in an array with the name 'data'. No parameters need to be provided.
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListList'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /list/{list_id}:
    get:
      operationId: lijstOpvragen
      tags:
      - Lists
      summary: Requesting a list
      description: All information about a list.
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - BaImMu3JZA
        description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: lijstWijzigen
      tags:
      - Lists
      summary: Modifying lists
      description: You will only have to include the fields that need to be modified in the application. Fields that are not mentioned will keep their current value. As soon as a field is mentioned, it is checked and may therefore cause an error message. A code is displayed with this error message. You may use this code in combination with the variable 'parameter' to display a message to the user. See above under 'Error messages' what the codes stand for.
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - BaImMu3JZA
        description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  examples:
                  - Nieuwsbrief
                  description: A name for the list in question
                locked:
                  type: boolean
                  examples:
                  - 'false'
                  description: If a list is locked, it cannot be changed by a user of the application. (true or false)
                remarks:
                  type: string
                  examples:
                  - Aangemaakt vanuit onze webshop.
                  description: Potential remarks
                subscribe_notification_email:
                  type: string
                  examples:
                  - aanmeldingen@example.net
                  description: Email address to which a notification will be sent upon a subscription
                unsubscribe_notification_email:
                  type: string
                  examples:
                  - afmeldingen@example.net
                  description: Email address to which a notification will be sent upon the cancelling of a subscription
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: lijstVerwijderen
      tags:
      - Lists
      summary: Deleting a list
      description: This permanently deletes a list. If the list does not exist, an error message is displayed. In response you are shown another list object, but now with the state 'deleted'. After having finished this procedure, it is no longer possible for the user to request the list.
      x-fern-explorer: false
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - BaImMu3JZA
        description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /list/{list_id}/members:
    delete:
      operationId: lijstLeegmaken
      tags:
      - Lists
      summary: Purging a list
      description: This permanently purges all active subscribers from a list, but doesn't delete the list itself. If the list does not exist, an error message is displayed. In response, you are shown another list object.
      x-fern-explorer: false
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - BaImMu3JZA
        description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: lijstSynchroniserenBulk
      tags:
      - Lists
      summary: Synchronizing a list (bulk)
      description: 'Adds, updates or unsubscribes multiple subscribers in one request. This endpoint is off by default: an account without access gets a 401 with the message "Not permitted to issue bulk requests (1)". Contact Laposta to have it enabled for your account.'
      x-fern-explorer: false
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - BaImMu3JZA
        description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actions:
                  type: string
                  examples:
                  - string
                  description: 'An array with at least one of the following options: add, update, or unsubscribe_excluded. These determine whether members may be added, updated and/or unsubscribed (read details below).'
                mode (verouderd):
                  type: string
                  examples:
                  - string
                  description: For backwards compatibility you can still pass edit, add or add_and_edit, but this parameter is being phased out. Do not send mode together with actions.
                members:
                  type: object
                  examples:
                  - string
                  description: An array with member objects. A minimum of 1, maximum of 500,000.
                member_id:
                  type: string
                  examples:
                  - ZKfjhLJHfl
                  description: The id of the subscriber, or simply their email address. Both work.
                email:
                  type: string
                  examples:
                  - relatie@example.net
                  description: The email address of the relation to be changed or added. If the member_id is also specified, then a new email address can be specified here for the existing relation.
                custom_fields:
                  type: object
                  examples:
                  - '{"voornaam":"Sanne","woonplaats":"Utrecht"}'
                  description: A JSON object where the key is the name of the extra field and the value is the value of the extra field.
                source_url:
                  type: string
                  examples:
                  - https://example.net/aanmelden
                  description: The URL from which the relation was registered.
              required:
              - actions
              - members
              - member_id
              - email
              - custom_fields
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /field:
    post:
      operationId: veldToevoegen
      tags:
      - Fields
      summary: Adding a field
      description: If there is something wrong with the parameters provided, a code is displayed with an error message. See above under 'Error messages' what the codes stand for.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                list_id:
                  type: string
                  examples:
                  - BaImMu3JZA
                  description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
                name:
                  type: string
                  examples:
                  - Nieuwsbrief
                  description: A name for this field
                defaultvalue:
                  type: string
                  examples:
                  - ''
                  description: A potential default value
                datatype:
                  type: string
                  enum: &id001
                  - text
                  - numeric
                  - date
                  - select_single
                  - select_multiple
                  examples:
                  - text
                  description: 'The data type: text, numeric, date, select_single or select_multiple'
                datatype_display:
                  type: string
                  enum: &id002
                  - select
                  - radio
                  examples:
                  - select
                  description: 'Only applicable for select_single: the desired display (select, radio)'
                options:
                  type: array
                  examples:
                  - Rood
                  description: What selection options are available? (mandatory for the data types select_single of select_multiple). The options can be given as an array. In the answer the options are repeated, but there is also an extra field options_full. Also listed are the option IDs, which may eventually be used to change the options later.
                required:
                  type: boolean
                  examples:
                  - 'false'
                  description: Is this a mandatory field?
                in_form:
                  type: boolean
                  examples:
                  - 'true'
                  description: Does this field occur in the subscription form? (boolean)
                in_list:
                  type: boolean
                  examples:
                  - 'true'
                  description: Is this field visible in Laposta's overview? (boolean)
              required:
              - list_id
              - name
              - datatype
              - required
              - in_form
              - in_list
      responses:
        '201':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldEnvelope'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: alleVeldenOpvragen
      tags:
      - Fields
      summary: Get all fields
      description: All fields of a list in an array of field objects. The field objects are formatted in an array named 'data'.
      parameters:
      - name: list_id
        in: query
        required: true
        schema:
          type: string
          examples:
          - BaImMu3JZA
        description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldList'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /field/{field_id}:
    get:
      operationId: veldOpvragen
      tags:
      - Fields
      summary: Requesting a field
      description: All information about a field.
      parameters:
      - name: list_id
        in: query
        required: true
        schema:
          type: string
          examples:
          - BaImMu3JZA
        description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - Z87ysHha9A
        description: The id of the field. You find it in the response of [Get all fields](/velden/alle-velden-opvragen).
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldEnvelope'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: veldWijzigen
      tags:
      - Fields
      summary: Modifying fields
      description: 'You will only have to include the parts that need to be modified. Parts that are not mentioned will keep their current values. As soon as a part is mentioned it does get checked, and thus can cause an error message. This error message contains a code with a message. See above under ''Error messages'' what these codes stand for. Pass options_full as a complete replacement for the option list. The key of each entry determines the operation: You may also pass options_full as an array of {"id", "value"} objects — the same shape as the response. The API will handle both formats.'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                list_id:
                  type: string
                  examples:
                  - BaImMu3JZA
                  description: The id of the list. You find it in the response of [Get all lists](/lijsten/alle-lijsten-opvragen), and in the application in the URL of the list.
                name:
                  type: string
                  examples:
                  - Nieuwsbrief
                  description: A name for this field
                datatype:
                  type: string
                  enum: *id001
                  examples:
                  - text
                  description: The data type of this field (text, numeric, date, select_single, select_multiple)
                datatype_display:
                  type: string
                  enum: *id002
                  examples:
                  - select
                  description: 'Only applicable for select_single: the desired display (select, radio)'
                options_full:
                  type: array
                  examples:
                  - '{"1":"Rood","2":"Groen"}'
                  description: 'The full set of options for a select_single or select_multiple field, as a key/value map of id → label. The key controls what happens to each option: Existing numeric ID (e.g. "2") — keeps or modifies the option. Changing the label updates it in-place; the ID stays the same, so existing member data is preserved. Non-numeric key (e.g. "new-0") — adds a new option; a fresh ID is assigned automatically. Omitting an existing ID — deletes that option. Always include every option you want to keep. Must be sent as JSON. Alternative format: instead of a key/value map you may also pass an array of objects in the same shape as the response: [{"id": "1", "value": "Red"}, {"id": "new-0", "value": "Orange"}]. The API will normalise this automatically.'
                defaultvalue:
                  type: string
                  examples:
                  - ''
                  description: The default value (will be used in the absence of this field)
                required:
                  type: boolean
                  examples:
                  - 'false'
                  description: Is this a mandatory field?
                in_form:
                  type: boolean
                  examples:
                  - 'true'
                  description: Does this field occur in the subscription form? (boolean)
                in_list:
                  type: boolean
                  examples:
                  - 'true'
                  description: Is this field visible in Laposta's overview? (boolean)
              required:
              - list_id
              - required
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldEnvelope'
        '400':
          description: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No valid API key was provided, or this endpoint is not enabled for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
