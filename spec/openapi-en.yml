      tags:
      - Campaigns
      summary: Requesting campaign history
      description: The full event history of a campaign. A campaign can contain many events; use pagination to retrieve additional pages.
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
          examples:
          - njhgaf61ye
        description: The id of the campaign. You find it in the response of [Get all campaigns](/campagnes/alle-campagnes-opvragen).
      - name: event_date_from
        in: query
        required: false
        schema:
          type: string
          examples:
          - '2026-04-01 00:00:00'
        description: Only return events from this date and time, inclusive. Use the regular format or ISO format described above.
      - name: event_date_to
        in: query
        required: false
        schema:
          type: string
          examples:
          - '2026-05-01 00:00:00'
        description: Only return events before this date and time, exclusive. Use the regular format or ISO format described above.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          examples:
          - '100'
        description: Maximum number of history items to return. Default is 100, maximum is 1000
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          examples:
          - opaque_cursor_value
        description: Cursor from pagination.next_cursor to request the next page. Do not interpret this value yourself; send it back unchanged.
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          examples:
          - event_date
        description: Field to order by. Currently only event_date is supported
      - name: order
        in: query
        required: false
