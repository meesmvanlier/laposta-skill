endpoint.relatieToevoegen.description: If there is something wrong with the parameters provided, a code is displayed with an error message. You can use this in combination with the variable 'parameter' to display a message to the user. See above under 'Error messages' what the codes stand for.
endpoint.relatieToevoegen.summary: Adding a subscriber
endpoint.relatieVerwijderen.description: This permanently deletes a subscriber. If the subscriber does not exist, an error message is displayed. In response you are shown another list object, but now with the state 'deleted'. After having finished this procedure, it is no longer possible for the user to request the subscriber.
endpoint.relatieVerwijderen.summary: Deleting a subscriber
endpoint.relatieWijzigen.description: You only have to include the fields that need to be modified in the request. Fields that are not named will keep their current value. As soon as a field is mentioned it does get checked, and thus can cause an error message. This error message displays a code with a message. See above under 'Error messages' what the codes stand for.
