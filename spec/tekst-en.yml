endpoint.segmentOpvragen.description: All information about a segment.
endpoint.segmentOpvragen.summary: Retrieve segment
endpoint.segmentToevoegen.description: If there is something wrong with the provided parameters, an error code and message will be displayed. See above under Error Messages for what the codes mean.
endpoint.segmentToevoegen.summary: Add segment
endpoint.segmentVerwijderen.description: This permanently deletes a segment. After this, the segment cannot be retrieved again.
endpoint.segmentVerwijderen.summary: Delete segment
endpoint.segmentWijzigen.description: You only need to include the fields that need to be changed in the request. Fields that are not mentioned retain their current value. Once a field is mentioned, it is checked and can therefore cause an error message. This error message will include a code and a message. See above under Error Messages for what the codes mean.
endpoint.segmentWijzigen.summary: Modify segment
endpoint.veldOpvragen.description: All information about a field.
endpoint.veldOpvragen.summary: Requesting a field
