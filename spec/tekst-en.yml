antwoord.standaard: The request succeeded.
auth.beschrijving: Enter your API key at `api_key` and leave `leave_empty` empty. The API uses basic auth, with your key in place of the username. In curl that reads `-u YOUR_KEY:`, with a colon and nothing after it.
endpoint.alleCampagnesOpvragen.description: All campaigns in an array of campaign objects. The campaign objects have been ordered in an array with the name 'data'.
endpoint.alleCampagnesOpvragen.summary: Get all campaigns
endpoint.alleLijstenOpvragen.description: All lists in an array of list objects. The list objects have been ordered in an array with the name 'data'. No parameters need to be provided.
endpoint.alleLijstenOpvragen.summary: Requesting all lists
endpoint.alleRelatiesOpvragen.description: All fields of a list in an array of member objects. The member objects are formatted in an array named 'data'.
endpoint.alleRelatiesOpvragen.summary: Get all subscribers
endpoint.alleResultatenOpvragen.description: The results of all campaigns in an array of list objects. The report objects have been ordered in an array with the name 'data'.
endpoint.alleResultatenOpvragen.summary: Get all results
endpoint.alleSegmentenOpvragen.description: All segments of a list in an array of segment objects. The segment objects are included in an array named 'data'.
endpoint.alleSegmentenOpvragen.summary: Get all segments
endpoint.alleVeldenOpvragen.description: All fields of a list in an array of field objects. The field objects are formatted in an array named 'data'.
endpoint.alleVeldenOpvragen.summary: Get all fields
endpoint.alleWebhooksOpvragen.description: All webhooks of a list in an array of member objects. The webhook objects are formatted in an array named 'data'.
endpoint.alleWebhooksOpvragen.summary: Get all webhooks
endpoint.campagneAanmaken.description: Creates a campaign. A campaign you create through the API can be filled with `/content` afterwards; campaigns built in the drag-and-drop editor cannot.
endpoint.campagneAanmaken.summary: Creating a campaign
endpoint.campagneContentOpvragen.description: Requesting the content of a campaign. Please note that this is only possible if it involves a campaign that has been exported, and not for a campaign created within the application using the drag & drop editor.
endpoint.campagneContentOpvragen.summary: Requesting campaign content
endpoint.campagneContentVullen.description: 'Filling in the content of a campaign The campaign can either be filled directly with html, or through a URL, in which case Laposta imports the html found at the specified URL. One of the two must be chosen. If both parameters are given the html is taken. If the import fails, a 400 error message from the API will occur. If it does succeed in importing the html, but problems were found during the import, they are shown in the variable report in the response. These may include: Solving these problems is not necessary in order to properly send the newsletter, but it is highly recommended. In the case of a free account, our advertising is added to the bottom of the newsletter. If the offered html does not contain an unsubscribe link, it will simply be added by our program.'
endpoint.campagneContentVullen.summary: Filling campaign content
endpoint.campagneInplannen.description: Schedules the campaign for a moment in the future. You cancel a scheduled campaign by deleting it.
endpoint.campagneInplannen.summary: Planning a campaign
endpoint.campagneOpvragen.description: All information about a campaign
endpoint.campagneOpvragen.summary: Requesting a campaign
endpoint.campagneTesten.description: 'Sending a test mail Note: only in the case of a campaign for which there already is content, but which has not yet been sent, is it possible for a test email to be sent.'
endpoint.campagneTesten.summary: Testing a campaign
endpoint.campagneVerwijderen.description: This deletes a campaign. Unsent campaigns will be permanently deleted. Campaigns that have been sent are permanently deleted only after 180 days. In the meantime, they can be restored in the overview of campaigns in our program. In response you are shown another campaign object, but now with the state 'deleted'. After having finished this procedure, it is no longer possible for the user to request the campaign.
endpoint.campagneVerwijderen.summary: Deleting a campaign
endpoint.campagneVerzenden.description: 'Sends the campaign to all connected lists and segments right away. This call cannot be undone, and it is not blocked when the campaign was already sent: a second call starts delivery again.'
endpoint.campagneVerzenden.summary: Sending a campaign
endpoint.campagneWijzigen.description: You only have to submit the fields that require to be modified in the application. Fields that are not mentioned will keep their current value fields keep their current value. As soon as a field is mentioned it does get checked, and thus can cause an error message. This error message displays a code with a message. See above under 'Error messages' what the codes stand for.
endpoint.campagneWijzigen.summary: Modifying a campaign
endpoint.campagnegeschiedenisOpvragen.description: The full event history of a campaign. A campaign can contain many events; use pagination to retrieve additional pages.
endpoint.campagnegeschiedenisOpvragen.summary: Requesting campaign history
endpoint.campagneresultatenOpvragen.description: The results of a campaign.
endpoint.campagneresultatenOpvragen.summary: Campaign results
endpoint.lijstLeegmaken.description: This permanently purges all active subscribers from a list, but doesn't delete the list itself. If the list does not exist, an error message is displayed. In response, you are shown another list object.
endpoint.lijstLeegmaken.summary: Purging a list
endpoint.lijstOpvragen.description: All information about a list.
endpoint.lijstOpvragen.summary: Requesting a list
endpoint.lijstSynchroniserenBulk.description: 'Adds, updates or unsubscribes multiple subscribers in one request. This endpoint is off by default: an account without access gets a 401 with the message "Not permitted to issue bulk requests (1)". Contact Laposta to have it enabled for your account.'
endpoint.lijstSynchroniserenBulk.summary: Synchronizing a list (bulk)
endpoint.lijstToevoegen.description: If there is something wrong with the parameters provided, a code is displayed with an error message. You may use these in combination with the variable 'parameter' to display a message to the user. See above under 'Error messages' what the codes stand for.
endpoint.lijstToevoegen.summary: Adding a list
endpoint.lijstVerwijderen.description: This permanently deletes a list. If the list does not exist, an error message is displayed. In response you are shown another list object, but now with the state 'deleted'. After having finished this procedure, it is no longer possible for the user to request the list.
endpoint.lijstVerwijderen.summary: Deleting a list
endpoint.lijstWijzigen.description: You will only have to include the fields that need to be modified in the application. Fields that are not mentioned will keep their current value. As soon as a field is mentioned, it is checked and may therefore cause an error message. A code is displayed with this error message. You may use this code in combination with the variable 'parameter' to display a message to the user. See above under 'Error messages' what the codes stand for.
endpoint.lijstWijzigen.summary: Modifying lists
endpoint.relatieOpvragen.description: All information about a subscriber in a member object
