tag.campagnes.beschrijving: 'Campaigns are the newsletters themselves: create, fill with html, test, schedule and send.'
tag.campagnes.naam: Campaigns
tag.lijsten.beschrijving: A list holds the subscribers you send newsletters to. Use these endpoints to create lists, retrieve them and empty them.
tag.lijsten.naam: Lists
tag.relaties.beschrijving: 'Subscribers are the people in a list. This is the most used part of the API: adding, updating, unsubscribing and reading history.'
tag.relaties.naam: Subscribers
tag.resultaten.beschrijving: 'The results of a sent campaign: how many arrived, were opened and were clicked.'
tag.resultaten.naam: Results
tag.segmenten.beschrijving: A segment is a selection within a list, stored as a definition of blocks and rules.
tag.segmenten.naam: Segments
tag.velden.beschrijving: Fields define which data you store per subscriber. Every list has an email field, plus the fields you add yourself.
tag.velden.naam: Fields
tag.webhooks.beschrijving: A webhook lets Laposta notify your own system as soon as something changes in a list.
tag.webhooks.naam: Webhooks
