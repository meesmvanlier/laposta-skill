endpoint.veldToevoegen.summary: Adding a field
endpoint.veldVerwijderen.description: This permanently deletes a field. If the field does not exist, an error message is displayed. In response you are shown another field object, but now with the state 'deleted'. After having finished this procedure, it is no longer possible for the user to request the field.
endpoint.veldVerwijderen.summary: Deleting a field
endpoint.veldWijzigen.description: 'You will only have to include the parts that need to be modified. Parts that are not mentioned will keep their current values. As soon as a part is mentioned it does get checked, and thus can cause an error message. This error message contains a code with a message. See above under ''Error messages'' what these codes stand for. Pass options_full as a complete replacement for the option list. The key of each entry determines the operation: You may also pass options_full as an array of {"id", "value"} objects — the same shape as the response. The API will handle both formats.'
endpoint.veldWijzigen.summary: Modifying fields
