extra.CampaignContent: The content of a campaign in html and in plain text.
extra.Error: Every error has the same shape.
extra.History: A page of events, together with the pagination, sorting and filters that were applied.
extra.SyncResult: The result of a synchronisation, split into added, edited, skipped and failed.
fout.400: The request is not valid. The response contains a `type`, a `message` and usually a `code` plus the `parameter` that caused it. An object that does not exist also falls under this, with code 203.
fout.401: No valid API key was provided, or this endpoint is not enabled for this account.
fout.429: Too many requests in one minute. The `Retry-After` header tells you how many seconds to wait.
info.beschrijving: 'The Laposta API follows REST. All responses, including errors, are JSON. Authenticate with basic auth: your API key is the username and the password stays empty.'
info.titel: Laposta API
